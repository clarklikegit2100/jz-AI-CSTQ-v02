# HuH7 hepatocellular carcinoma — BSGM configuration
base_config: base_bsgm.yaml

dataset: ctchuh7
data_dir: F:/GitHub/jz-AI-CSTQ-v02/data
output_dir: F:/GitHub/jz-AI-CSTQ-v02/results/ctchuh7_bsgm

# HuH7 specific: larger images, more cells per frame
# 256x256 used on cloud (standard MHA encoder OOMs at 512x512 — 136 GB attention)
target_size: [256, 256]
num_queries: 300
batch_size: 1

# Swin-T backbone
backbone: swin_t
swin_window_size: 7

# Temporal Mamba: more state for complex cell motion
mamba_d_state: 32

# Graph: larger neighbourhood for dense HuH7 culture
graph_topk: 20
graph_heads: 4

# Uncertainty: slightly higher dropout for robustness
bayesian_dropout: 0.1

# Classification fix: increase matcher class cost + loss weight so cls head
# dominates matching (default set_cost_class=1 is overwhelmed by bbox=5 when
# boxes are uncertain early in training, causing noisy matches → collapsed cls).
set_cost_class: 4.0
cls_loss_coef: 8.0
