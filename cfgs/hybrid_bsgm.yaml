# ============================================================
# HybridCellTracker — EmbedTrack 分割 + BSGM 追踪
# 混合架构配置（标准训练）
# ============================================================

base_config: base_bsgm.yaml

dataset: ctchuh7
data_dir: F:/GitHub/jz-AI-CSTQ-v02/data
output_dir: F:/GitHub/jz-AI-CSTQ-v02/results/hybrid_bsgm
target_size: [512, 512]

# --- 主干 ---
backbone: swin_t
swin_window_size: 7
backbone_in_channels: 3

# --- Transformer（追踪分支精简，分割分支无需） ---
hidden_dim: 256
nheads: 8
enc_layers: 2              # 比纯 BSGM 少（分割分支已做特征提炼）
dec_layers: 4              # 追踪解码器层数
dim_feedforward: 1024
dropout: 0.1
num_feature_levels: 4
dec_n_points: 4

# --- 查询（追踪分支新目标查询） ---
num_queries: 300           # 比纯 BSGM 少（track query 由桥接模块初始化）
num_classes: 1

# --- Mamba ---
mamba_d_state: 16
mamba_d_conv: 4

# --- 图注意力 ---
graph_topk: 16
graph_heads: 4

# --- 贝叶斯 ---
bayesian_dropout: 0.1
bayesian_eval: false
mc_samples: 1

# --- 追踪 ---
tracking: true
with_div: true
with_box_refine: true

# --- 分割分支损失权重 ---
seg_loss_coef: 1.0         # EmbedSeg 总损失权重
track_offset_coef: 1.0     # 追踪偏移损失权重

# --- 追踪分支损失权重 ---
cls_loss_coef: 4.0
bbox_loss_coef: 5.0
giou_loss_coef: 2.0
set_cost_class: 1.0
set_cost_bbox: 5.0
set_cost_giou: 2.0
set_cost_mask: 0.0         # 掩码由分割分支处理

# --- 联合损失权重 ---
lambda_seg: 1.0
lambda_track: 1.0
lambda_aux: 0.5

focal_alpha: 0.25
focal_gamma: 2.0

# --- 训练 ---
epochs: 24
warmup_epochs: 8           # 阶段 1：仅训练分割分支（主干冻结）
lr: 0.0002
lr_backbone: 0.00002
lr_drop: 20
weight_decay: 0.0001
clip_max_norm: 0.1
use_amp: true
batch_size: 1
num_workers: 4
save_checkpoint_every: 4
