base_config: base_bsgm.yaml

# L0 v2: same 5-frame GOWT1 memorisation gate, now with the fixes that target
# the query-collapse discovered in v1:
#   - ImageNet-pretrained ResNet-50 backbone (Cell-TRACTR uses ResNet, not a
#     from-scratch Swin; from-scratch backbone -> identical two-stage proposals
#     -> all object queries collapse to one central prediction).
#   - corrected deformable box-refine formula (delta added in logit space).
#   - point-sampled dice+BCE mask loss (from v1, kept).
output_dir: /home/clark/Documents/GitHub/jz-AI-Experiments/all-exps/exp000004-jz-AI-CSTQ-v02-20260902/03-Result/diagnostics/gowt1_mask_overfit5_v2
dataset: ctcgowt1_exp000004_mask_overfit5
seed: 42
train_ann_file: /home/clark/Documents/GitHub/jz-AI-Experiments/all-exps/exp000002-jz-AI-CSTQ-20260830-v1/03-Result/stage1_data/ctcgowt1_fold_a_mild/COCO/annotations/train/anno.json
train_img_dir: /home/clark/Documents/GitHub/jz-AI-Experiments/all-exps/exp000002-jz-AI-CSTQ-20260830-v1/03-Result/stage1_data/ctcgowt1_fold_a_mild/COCO/train/img
train_ignore_dir: /home/clark/Documents/GitHub/jz-AI-Experiments/all-exps/exp000002-jz-AI-CSTQ-20260830-v1/03-Result/stage1_data/ctcgowt1_fold_a_mild/COCO/train/ignore
val_ann_file: /home/clark/Documents/GitHub/jz-AI-Experiments/all-exps/exp000002-jz-AI-CSTQ-20260830-v1/03-Result/stage1_data/ctcgowt1_fold_a_mild/COCO/annotations/train/anno.json
val_img_dir: /home/clark/Documents/GitHub/jz-AI-Experiments/all-exps/exp000002-jz-AI-CSTQ-20260830-v1/03-Result/stage1_data/ctcgowt1_fold_a_mild/COCO/train/img
val_ignore_dir: /home/clark/Documents/GitHub/jz-AI-Experiments/all-exps/exp000002-jz-AI-CSTQ-20260830-v1/03-Result/stage1_data/ctcgowt1_fold_a_mild/COCO/train/ignore

# --- backbone ---
backbone: resnet50
backbone_pretrained: true

# --- decoder: disable the non-standard query-mixing blocks ---
# The kNN graph layer + query-Mamba SSM run over the query set every decoder
# layer and homogenise the 32 object queries (cos-sim -> 0.99) regardless of
# the loss, which is why every query predicts the same box/mask. Reduce the
# decoder to a standard DETR block (self-attn + deformable cross-attn).
decoder_use_graph: false
decoder_use_query_mamba: false

target_size: [256, 256]
num_queries: 32
train_max_samples: 5
val_max_samples: 5
batch_size: 1
num_workers: 0
epochs: 110
warmup_epochs: 10         # backbone frozen for the detection warmup only
mask_warmup_epochs: 25    # detection-only first; snapshot the assignment at
                          # epoch 24 and freeze it for the mask phase
freeze_matching: true
max_track_queries: 0
use_amp: false
save_checkpoint_every: 25
lr: 0.0002
lr_backbone: 0.00002
lr_drop: 85
mask_lr_mult: 3.0
clip_max_norm: 1.0

# --- mask supervision ---
mask_num_points: 12544
mask_oversample_ratio: 3.0
mask_importance_sample_ratio: 0.75
mask_gt_bbox_fraction: 0.5
cost_mask_points: 3000
mask_loss_type: bce

# --- loss weights ---
cls_loss_coef: 2.0
bbox_loss_coef: 5.0
giou_loss_coef: 2.0
mask_loss_coef: 5.0
dice_loss_coef: 5.0
set_cost_mask: 0.0
