base_config: base_bsgm.yaml

# resolution_scaling_plan.md Phase 1: tiled training. Same architecture as
# gowt1_dn_seg2 (query collapse solved, SEG ~0.51 at whole-frame 256 downscale
# from native 1024) but samples native-resolution 256x256 TILES instead of
# downscaling the whole 1024x1024 frame. A ~74px GOWT1 nucleus stays ~74px
# (was shrunk to ~18px by the 4x whole-frame downscale) — this is the fix for
# the SEG plateau, which point-sampled-mask-loss and query-denoising tuning
# could not close on their own (see 04-Result-Analysis/query_collapse_bugfix_report.md).
