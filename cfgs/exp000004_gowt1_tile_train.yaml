backbone: resnet50
backbone_pretrained: true
decoder_use_graph: false
decoder_use_query_mamba: false

dn_number: 5
dn_box_noise_scale: 0.4
dn_aux: false

mask_stride: 4

# --- tiling (new) ---
tile_size: 256
tile_pos_ratio: 0.7
tile_min_area_ratio: 0.3

target_size: [256, 256]
num_queries: 20              # ~2-6 cells/tile typically; leave headroom
batch_size: 1
num_workers: 4
epochs: 60
warmup_epochs: 3
mask_warmup_epochs: 5
max_track_queries: 0
use_amp: false
save_checkpoint_every: 5
lr: 0.0002
lr_backbone: 0.00002
lr_drop: 45
mask_lr_mult: 2.0
clip_max_norm: 1.0
max_val_steps: 40

mask_num_points: 12544
mask_gt_bbox_fraction: 0.5
cost_mask_points: 3000
mask_loss_type: bce

cls_loss_coef: 2.0
bbox_loss_coef: 5.0
giou_loss_coef: 2.0
mask_loss_coef: 5.0
dice_loss_coef: 5.0
