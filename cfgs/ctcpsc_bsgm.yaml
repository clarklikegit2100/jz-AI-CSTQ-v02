# Pluripotent Stem Cells (PSC) — BSGM configuration
base_config: base_bsgm.yaml

dataset: ctcpsc
data_dir: F:/GitHub/jz-AI-CSTQ-v02/data
output_dir: F:/GitHub/jz-AI-CSTQ-v02/results/ctcpsc_bsgm

target_size: [512, 512]
